---
# Infomaniak apps: same steps as ansible-role-ksuite (same URLs, checksums and target files)
- name: "{{ appimage_app.name }}: current version published by Infomaniak"
  ansible.builtin.uri:
    url: "{{ appimage_app.release_url }}"
    return_content: true
  register: appimage_release
  check_mode: false               # read only; --check shows the real result

- name: "{{ appimage_app.name }}: Linux entry in the release JSON"
  ansible.builtin.set_fact:
    appimage_release_key: "{{ appimage_app.release_keys | select('in', appimage_release.json) | first | default('') }}"

- name: "{{ appimage_app.name }}: Linux entry found"
  ansible.builtin.assert:
    that:
      - appimage_release_key | length > 0
      - appimage_release.json[appimage_release_key].downloadurl is defined
    fail_msg: >-
      appimage: {{ appimage_app.name }}: none of {{ appimage_app.release_keys | join(', ') }} (with downloadurl) in
      {{ appimage_app.release_url }} - Infomaniak probably renamed it, the JSON now has:
      {{ appimage_release.json.keys() | join(', ') }} → adjust release_keys in vars/main.yml
    quiet: true

- name: "{{ appimage_app.name }}: download URL"
  ansible.builtin.set_fact:
    appimage_url: "{{ appimage_release.json[appimage_release_key].downloadurl }}"

- name: "{{ appimage_app.name }}: checksum from <downloadurl>.sha256"
  ansible.builtin.set_fact:
    appimage_checksum: "sha256:{{ appimage_url }}.sha256"
  when: appimage_app.checksum == 'sha256'

- name: "{{ appimage_app.name }}: checksum from latest-linux.yml"
  when: appimage_app.checksum == 'electron'
  block:
    - name: "{{ appimage_app.name }}: latest-linux.yml"
      ansible.builtin.uri:
        url: "{{ appimage_url | dirname }}/latest-linux.yml"
        return_content: true
      register: appimage_update_info
      check_mode: false

    # sha512 is base64 there, get_url wants hex
    - name: "{{ appimage_app.name }}: sha512 as hex"
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - import base64, sys; print(base64.b64decode(sys.argv[1]).hex())
          - >-
            {{ (appimage_update_info.content | from_yaml).files
            | selectattr('url', 'equalto', appimage_url | basename) | map(attribute='sha512') | first }}
      register: appimage_sha512
      changed_when: false
      check_mode: false

    - name: "{{ appimage_app.name }}: checksum"
      ansible.builtin.set_fact:
        appimage_checksum: "sha512:{{ appimage_sha512.stdout | trim }}"

# downloads only when the file is missing or its checksum differs (= update); the new file replaces the old
# one atomically, running instances keep the old one until they restart
- name: "{{ appimage_app.name }}: AppImage"
  ansible.builtin.get_url:
    url: "{{ appimage_url }}"
    dest: "{{ appimage_file }}"
    checksum: "{{ appimage_checksum }}"
    owner: root
    group: root
    mode: "0755"
  register: appimage_get

- name: "{{ appimage_app.name }}: changed"
  ansible.builtin.set_fact:
    appimage_changed: "{{ appimage_get is changed }}"
